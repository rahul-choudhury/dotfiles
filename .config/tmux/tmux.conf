set -sg escape-time 0
set -g focus-events on

set -g extended-keys on
set -g extended-keys-format csi-u

set -g base-index 1
set -g renumber-windows
set -g status-left '[#S] '
set -g status-right ""
set -g status-left-length 100

# Keep the status line in sync with Ghostty's Zenwritten/Zenbones theme.
# Ghostty reports appearance changes to tmux, which exposes them as hooks.
set-hook -g client-light-theme 'set -g status-style "fg=#353535,bg=#d7d7d7"'
set-hook -g client-dark-theme 'set -g status-style "fg=#b4bdc3,bg=#352f2d"'

# Set the right theme when the tmux server/config starts, before a hook fires.
if-shell 'test "$(defaults read -g AppleInterfaceStyle 2>/dev/null)" = Dark' \
  'set -g status-style "fg=#b4bdc3,bg=#352f2d"' \
  'set -g status-style "fg=#353535,bg=#d7d7d7"'

bind -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

bind k select-pane -U
bind j select-pane -D
bind h select-pane -L
bind l select-pane -R
